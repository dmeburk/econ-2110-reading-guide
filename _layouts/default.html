<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>

    <!-- KaTeX -->
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

    <script defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

    <script defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
      onload="renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '\\(', right: '\\)', display: false},
          {left: '$', right: '$', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
      });"></script>

    <style>
      /* --- Page typography --- */
      body {
        font-family: -apple-system, BlinkMacSystemFont,
                     "Segoe UI", Roboto, Helvetica, Arial,
                     sans-serif;
        line-height: 1.65;
        font-size: 17px;
        color: #222;
        max-width: 720px;
        margin: 2.5rem auto;
        padding: 0 1.25rem;
      }

      /* --- Headings --- */
      h1, h2, h3 {
        line-height: 1.3;
        margin-top: 2.2rem;
      }

      /* --- Math tweaks --- */
      .katex-display {
        text-align: center;
        margin: 1.5rem 0;
      }

      .katex {
        font-size: 1.05em;
      }
    </style>
  </head>

  <body>
    {{ content }}
  </body>
</html>
